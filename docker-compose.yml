services:
  mysql:
    image: mysql:8.4
    container_name: charging-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-charging_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-charging_station}
      MYSQL_USER: ${MYSQL_USER:-charging_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-charging_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--lower-case-table-names=1"]

  redis:
    image: redis:7-alpine
    container_name: charging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
